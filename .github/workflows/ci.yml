name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run guard:secrets
      - run: npm run guard:names
      - run: npm run typecheck
      - run: npm run content:validate
      - run: npm test
      # Production-mode build: 'proposed' and draft content must be absent from every public file.
      - run: NEXT_DIST_DIR=.next-prod npm run build
      - run: NEXT_DIST_DIR=.next-prod npm run leak-check
